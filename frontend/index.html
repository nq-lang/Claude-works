<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Charting System</title>
<style>
  :root {
    --bg: #0a0a0d;
    --panel: #101014;
    --border: #1e1e24;
    --text: #e8e8ec;
    --text-dim: #6b6b76;
    --accent: #d4a017;      /* gold — reserved for King Node / primary accents later */
    --up: #cfd3da;
    --down: #4a4e5a;
    --mono: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: var(--mono);
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .brand { display: flex; align-items: center; gap: 10px; letter-spacing: 0.12em; font-size: 13px; }
  .brand .mark { color: var(--accent); }
  .brand .name { color: var(--text-dim); }
  .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); transition: background 200ms; }
  .dot.ok { background: #4caf7d; }
  .dot.err { background: #c0546a; }

  .toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 11px; color: var(--text-dim);
  }
  .pill {
    padding: 4px 10px; border: 1px solid var(--border); border-radius: 3px;
    background: #0d0d11; color: var(--text-dim); user-select: none;
  }
  .pill.active { color: var(--text); border-color: #33333c; }

  /* --- Atlas toolbar (web/js/atlas.js) --------------------------------- */
  .atlas-ticker-select, .atlas-node-limit {
    background: #1a1a24; border: 1px solid #2a2e39; color: #fff;
    font-family: var(--mono); font-size: 11px; padding: 4px 6px; border-radius: 4px;
  }
  .atlas-interval-group, .atlas-exposure-group {
    display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden;
  }
  .atlas-interval-btn, .atlas-exp-btn {
    background: #0d0d11; border: none; color: var(--text-dim); font-family: var(--mono);
    font-size: 10px; padding: 4px 8px; cursor: pointer; border-right: 1px solid var(--border);
  }
  .atlas-interval-btn:last-child, .atlas-exp-btn:last-child { border-right: none; }
  .atlas-interval-btn.active, .atlas-exp-btn.active { background: #2a2e39; color: #fff; }
  .atlas-toggle {
    display: flex; align-items: center; gap: 4px; cursor: pointer;
    padding: 3px 6px; border: 1px solid var(--border); border-radius: 4px;
  }
  .atlas-toggle input { accent-color: var(--accent); }
  .atlas-expiration-group {
    display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden;
  }
  .atlas-expscope-btn {
    background: #0d0d11; border: none; color: var(--text-dim); font-family: var(--mono);
    font-size: 10px; padding: 4px 8px; cursor: pointer; border-right: 1px solid var(--border);
  }
  .atlas-expscope-btn:last-child { border-right: none; }
  .atlas-expscope-btn.active { background: #2a2e39; color: #fff; }
  .atlas-expiration-n {
    background: #1a1a24; border: 1px solid #2a2e39; color: #fff;
    font-family: var(--mono); font-size: 11px; padding: 4px 6px; border-radius: 4px;
  }
  .atlas-orbs-group { display: flex; align-items: center; gap: 4px; }
  .atlas-orbs-gear {
    background: #0d0d11; border: 1px solid var(--border); color: var(--text-dim);
    font-size: 10px; padding: 3px 6px; border-radius: 4px; cursor: pointer;
  }
  .atlas-nodes-group { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--text-dim); }

  /* --- Atlas multi-window layout (web/js/atlas-layout.js) --------------- */
  #atlas-multi-grid { position: absolute; inset: 0; display: grid; gap: 2px; background: var(--border); }
  .atlas-grid-single { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  .atlas-grid-2up { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
  .atlas-grid-2stack { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .atlas-grid-3up { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr; }
  .atlas-grid-3stack { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr 1fr; }
  .atlas-grid-4up { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .atlas-grid-4upwide { grid-template-columns: 1fr 1fr 1fr 1fr; grid-template-rows: 1fr; }
  .atlas-grid-4stack { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr 1fr 1fr; }
  .atlas-grid-1plus2 {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1.3fr 1fr;
    grid-template-areas: "main main" "side1 side2";
  }
  .atlas-grid-1pipe2 {
    grid-template-columns: 1.3fr 1fr;
    grid-template-rows: 1fr 1fr;
    grid-template-areas: "main side1" "main side2";
  }

  .atlas-multi-pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); overflow: hidden; }

  /* Per-pane on-chart header: ticker + price + %change ONLY, per the
     explicit correction — no other controls belong in the chart area. */
  .atlas-pane-header {
    flex-shrink: 0; display: flex; align-items: center; gap: 8px;
    padding: 5px 10px; border-bottom: 1px solid var(--border); font-size: 11px;
  }
  .atlas-pane-ticker-select {
    background: #1a1a24; border: 1px solid #2a2e39; color: #fff;
    font-family: var(--mono); font-weight: 600; font-size: 12px;
    padding: 3px 6px; border-radius: 4px;
  }
  .atlas-pane-price { font-weight: 600; color: #fff; }
  .atlas-pane-change { padding: 2px 6px; border-radius: 4px; font-size: 10px; color: var(--text-dim); }
  .atlas-pane-change.positive { color: #22c55e; background: rgba(34,197,94,0.15); }
  .atlas-pane-change.negative { color: #f0616d; background: rgba(240,97,109,0.15); }

  .atlas-pane-chart-wrapper { flex: 1; position: relative; min-height: 0; }
  .atlas-pane-chart { position: absolute; inset: 0; }

  /* --- Drawing tools (web/js/atlas-drawing.js) -------------------------- */
  .atlas-drawing-strip {
    position: absolute; z-index: 12; display: flex; flex-direction: row; align-items: center; gap: 3px;
    padding: 5px 7px 5px 4px; background: #1b1b1f; border: 1px solid #2e2e36; border-radius: 9px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.55); user-select: none; touch-action: none;
  }
  .atlas-drawing-grip {
    display: grid; grid-template-columns: repeat(2, 3px); grid-auto-rows: 3px; gap: 3px; padding: 0 7px 0 5px; align-self: stretch;
    align-content: center; cursor: grab; border-right: 1px solid #2e2e36; margin-right: 4px;
  }
  .atlas-drawing-grip i { width: 3px; height: 3px; border-radius: 50%; background: #6b6b76; display: block; }
  .atlas-drawing-grip:hover i { background: #cfd3da; }
  .atlas-drawing-grip.dragging { cursor: grabbing; }
  .atlas-drawing-tool {
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; padding: 0;
    background: transparent; border: 1px solid transparent; border-radius: 6px; color: #cfd3da; cursor: pointer;
  }
  .atlas-drawing-tool:hover { background: #2a2a33; color: #fff; }
  .atlas-drawing-tool.active { background: var(--accent); color: #000; }
  .atlas-drawing-tool.active svg circle { fill: var(--accent); }
  .atlas-drawing-tool-long { color: #4ade80; }
  .atlas-drawing-tool-long.active { background: #22c55e; color: #000; }
  .atlas-drawing-tool-short { color: #f87171; }
  .atlas-drawing-tool-short.active { background: #f0616d; color: #000; }
  .atlas-drawing-tool-range { color: #7fb0ff; }
  .atlas-drawing-tool-range.active { background: #5b8dd6; color: #000; }
  .atlas-drawing-clear { border-left: 1px solid #2e2e36; border-radius: 0 6px 6px 0; margin-left: 3px; }
  .atlas-drawing-canvas { position: absolute; inset: 0; z-index: 10; }
  .atlas-drawing-armed { cursor: crosshair; }
  .atlas-drawing-hover { cursor: pointer; }
  .atlas-drawing-sep { width: 1px; align-self: stretch; background: #2e2e36; margin: 2px 4px; }
  .atlas-drawing-mini {
    background: transparent; border: none; color: var(--text-dim); width: 26px; height: 26px; border-radius: 6px;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .atlas-drawing-mini:hover { background: #2a2a33; color: #fff; }
  .atlas-drawing-mini.active { background: #2a2a33; color: #ffd166; }
  /* Settings dialog (double-click a drawing, or the gear in the list) */
  .atlas-drawing-modal {
    position: absolute; z-index: 30; left: 50%; top: 18%; transform: translateX(-50%); width: 260px;
    background: #14141a; border: 1px solid #34343e; border-radius: 8px; padding: 10px 12px; box-shadow: 0 8px 28px rgba(0,0,0,.55);
    font-family: var(--mono); font-size: 11px; color: #d6d6de;
  }
  .atlas-drawing-modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .atlas-drawing-modal-title { font-size: 12px; color: #fff; }
  .atlas-drawing-modal-close { background: none; border: none; color: #8a8a94; font-size: 16px; cursor: pointer; }
  .atlas-drawing-switch { display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 8px; }
  .atlas-drawing-switch input { position: absolute; opacity: 0; pointer-events: none; }
  .atlas-drawing-switch-track { width: 30px; height: 16px; border-radius: 8px; background: #3a3a44; position: relative; transition: background .12s; flex-shrink: 0; }
  .atlas-drawing-switch-track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: transform .12s; }
  .atlas-drawing-switch input:checked + .atlas-drawing-switch-track { background: #22a35a; }
  .atlas-drawing-switch input:checked + .atlas-drawing-switch-track::after { transform: translateX(14px); }
  .atlas-drawing-modal-meta { color: #8a8a94; font-size: 10px; margin-bottom: 8px; word-break: break-word; }
  .atlas-drawing-delete { background: #2a1418; border: 1px solid #6b2630; color: #f0818c; font-family: var(--mono); font-size: 10px; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
  /* Drawings list */
  .atlas-drawing-list {
    position: absolute; z-index: 25; min-width: 230px; max-height: 240px; overflow: auto;
    background: #14141a; border: 1px solid #34343e; border-radius: 8px; padding: 4px; box-shadow: 0 8px 28px rgba(0,0,0,.55);
    font-family: var(--mono); font-size: 11px; color: #d6d6de;
  }
  .atlas-drawing-list-empty { padding: 8px; color: #6b6b76; }
  .atlas-drawing-row { display: flex; align-items: center; gap: 6px; padding: 3px 4px; border-radius: 5px; cursor: pointer; }
  .atlas-drawing-row:hover, .atlas-drawing-row.selected { background: #22222b; }
  .atlas-drawing-row.hidden { opacity: .45; }
  .atlas-drawing-row-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .atlas-drawing-eye, .atlas-drawing-gear { background: none; border: none; color: inherit; cursor: pointer; padding: 2px; display: inline-flex; }

  /* --- Orbs rendering layer (web/js/atlas-orbs.js) ----------------------
     Sits ABOVE the candlestick chart but BELOW the drawing-tools canvas
     (z-index 6 < 10), and never intercepts mouse events — Orbs are
     decorative/informational only. */
  .atlas-orb-canvas { position: absolute; inset: 0; z-index: 6; pointer-events: none; }

  .atlas-layout-btn, .atlas-window-settings-btn {
    background: #1a1a24; border: 1px solid #2a2e39; color: var(--text-dim);
    font-family: var(--mono); font-size: 10px; padding: 4px 10px; border-radius: 4px; cursor: pointer;
  }

  .atlas-orbs-popover {
    position: fixed; z-index: 1100; background: #101014; border: 1px solid #2a2e39;
    border-radius: 6px; padding: 12px; width: 220px; font-family: var(--mono); font-size: 11px;
  }
  .atlas-orbs-popover-title { color: #fff; margin-bottom: 8px; }
  .atlas-orbs-popover label { display: block; color: var(--text-dim); margin-bottom: 10px; }
  .atlas-orbs-popover input[type="range"] { width: 100%; accent-color: var(--accent); display: block; margin-top: 4px; }
  .atlas-orbs-popover-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 4px; }
  .atlas-orbs-reset-btn, .atlas-orbs-save-btn {
    font-family: var(--mono); font-size: 10px; padding: 4px 10px; border-radius: 4px; cursor: pointer;
  }
  .atlas-orbs-reset-btn { background: #1a1a24; border: 1px solid #2a2e39; color: var(--text-dim); }
  .atlas-orbs-save-btn { background: var(--accent); border: 1px solid var(--accent); color: #000; font-weight: 600; }

  .atlas-layout-modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: flex-start; justify-content: center;
    padding-top: 8vh; z-index: 1000;
  }
  .atlas-layout-modal {
    background: #101014; border: 1px solid #2a2e39; border-radius: 8px;
    width: 640px; max-width: 92vw; padding: 20px; font-family: var(--mono);
  }
  .atlas-layout-modal-header { display: flex; justify-content: space-between; align-items: flex-start; }
  .atlas-layout-modal-kicker { font-size: 10px; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 4px; }
  .atlas-layout-modal-title { font-size: 18px; color: #fff; }
  .atlas-layout-modal-close { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; }
  .atlas-layout-modal-sub { color: var(--text-dim); font-size: 12px; margin: 10px 0 16px; }
  .atlas-layout-modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .atlas-layout-option {
    border: 1px solid #2a2e39; border-radius: 6px; padding: 14px; cursor: pointer;
    background: #14141a; transition: border-color 120ms;
  }
  .atlas-layout-option:hover, .atlas-layout-option.active { border-color: var(--accent); }
  .atlas-layout-option-title { color: #fff; font-size: 13px; margin: 8px 0 4px; }
  .atlas-layout-option-desc { color: var(--text-dim); font-size: 11px; line-height: 1.4; }

  .atlas-layout-icon { display: flex; gap: 3px; height: 28px; }
  .atlas-layout-icon-box { flex: 1; background: #2a2e39; border-radius: 2px; border: 1px solid #3a3e49; }
  .atlas-layout-icon-2stack, .atlas-layout-icon-3stack, .atlas-layout-icon-4stack { flex-direction: column; }
  .atlas-layout-icon-1plus2, .atlas-layout-icon-1pipe2 { flex-direction: column; }
  .atlas-layout-icon-1pipe2 { flex-direction: row; }
  .atlas-layout-icon-1plus2 .atlas-layout-icon-row { display: flex; gap: 3px; flex: 1; }
  .atlas-layout-icon-1pipe2 .atlas-layout-icon-col { display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .atlas-layout-icon-wide { flex: 1; }
  .atlas-layout-icon-tall { flex: 1.3; }
  .atlas-layout-icon-4upwide { display: flex; gap: 3px; height: 28px; }

  .atlas-window-settings-panel {
    position: fixed; top: 90px; right: 24px; z-index: 1000;
    background: #101014; border: 1px solid #2a2e39; border-radius: 6px;
    padding: 12px; width: 220px; font-family: var(--mono); font-size: 11px;
  }
  .atlas-window-settings-title { color: #fff; margin-bottom: 8px; }
  .atlas-window-settings-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; color: var(--text-dim); }
  .atlas-window-settings-ticker {
    background: #1a1a24; border: 1px solid #2a2e39; color: #fff;
    font-family: var(--mono); font-size: 10px; padding: 2px 4px; border-radius: 3px;
  }

  /* --- Chart Layouts (named workspace presets, web/js/atlas-layout.js) -- */
  .atlas-layouts-btn {
    background: #1a1a24; border: 1px solid #2a2e39; color: var(--text-dim);
    font-family: var(--mono); font-size: 10px; padding: 4px 10px; border-radius: 4px; cursor: pointer;
  }
  .atlas-layouts-btn-name { color: #fff; }
  .atlas-layouts-panel {
    position: fixed; top: 90px; left: 160px; z-index: 1000;
    background: #101014; border: 1px solid #2a2e39; border-radius: 6px;
    padding: 8px; width: 240px; font-family: var(--mono); font-size: 12px;
  }
  .atlas-layouts-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 8px; border-radius: 4px; cursor: pointer; color: var(--text-dim);
  }
  .atlas-layouts-row:hover { background: #1a1a24; }
  .atlas-layouts-row.active { background: #1a1a24; color: #fff; border-left: 2px solid var(--accent); }
  .atlas-layouts-row-name { flex: 1; }
  .atlas-layouts-row-actions { display: flex; gap: 4px; }
  .atlas-layouts-rename-btn, .atlas-layouts-delete-btn {
    background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 11px; padding: 2px 4px;
  }
  .atlas-layouts-rename-btn:hover { color: #fff; }
  .atlas-layouts-delete-btn:hover { color: #f0616d; }
  .atlas-layouts-delete-btn.confirming { color: #f0616d; font-weight: 700; font-size: 9px; }
  .atlas-layouts-rename-input {
    flex: 1; background: #1a1a24; border: 1px solid var(--accent); color: #fff;
    font-family: var(--mono); font-size: 12px; padding: 2px 4px; border-radius: 3px;
  }
  .atlas-layouts-new-btn {
    width: 100%; margin-top: 4px; background: #0d0d11; border: 1px dashed var(--border);
    color: var(--text-dim); font-family: var(--mono); font-size: 11px; padding: 6px; border-radius: 4px; cursor: pointer;
  }
  .atlas-layouts-new-btn:hover { border-color: var(--accent); color: #fff; }

  .atlas-live-btn {
    margin-left: auto; background: #0d1f14; border: 1px solid #22c55e; color: #4ade80;
    font-family: var(--mono); font-size: 10px; padding: 4px 10px; border-radius: 12px; cursor: pointer;
  }
  .atlas-live-btn.atlas-live-paused {
    background: #241a0d; border-color: #fbbf24; color: #fbbf24;
  }
  .atlas-reset-view-btn {
    margin-left: 6px; background: #0d0d11; border: 1px solid var(--border); color: var(--text-dim);
    font-family: var(--mono); font-size: 10px; padding: 4px 10px; border-radius: 12px; cursor: pointer;
  }
  .atlas-heatmap-restore-btn {
    margin-left: 6px; background: #0d0d11; border: 1px solid var(--accent); color: #fff;
    font-family: var(--mono); font-size: 10px; padding: 4px 10px; border-radius: 12px; cursor: pointer;
  }
  .atlas-reset-view-btn:hover { border-color: var(--accent); color: #fff; }

  main { flex: 1; display: flex; min-height: 0; }
  #chart-pane { flex: 1; min-width: 0; position: relative; }
  #chart { position: absolute; inset: 0; }

  #sidecar {
    width: 300px; flex-shrink: 0; border-left: none; background: var(--panel);
    display: flex; flex-direction: column; min-height: 0;
  }

  /* Resizable divider (this feature): a thin line between the chart area
     and the sidecar heatmap(s) — drag to reallocate horizontal space
     between them. Rendered as border color at rest, brightens to solid
     white on hover/drag so it reads as an interactive element. */
  #atlas-resizer {
    width: 5px; flex-shrink: 0; cursor: col-resize; background: var(--border);
    position: relative;
  }
  #atlas-resizer:hover, #atlas-resizer.resizing { background: #fff; }
  #atlas-resizer::after {
    content: ''; position: absolute; top: 0; bottom: 0; left: -3px; right: -3px;
  }

  /* --- Atlas sidecar controller (web/js/atlas-sidecar.js) --------------- */
  .sidecar-header-controls {
    display: flex; align-items: center; gap: 6px; padding: 6px 10px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .sidecar-quad-toggle {
    display: flex; align-items: center; gap: 4px; cursor: pointer;
    font-size: 11px; color: var(--text-dim);
  }
  .sidecar-quad-toggle input { accent-color: var(--accent); }
  /* Single toggle button (no separate checkbox+gear) that opens the
     Off/2/3/4 options popover — same visual language as the chart
     toolbar's "Windows" button (.atlas-window-settings-btn). */
  .sidecar-quad-toggle-btn {
    background: #1a1a24; border: 1px solid #2a2e39; color: var(--text-dim);
    font-family: var(--mono); font-size: 10px; padding: 4px 10px; border-radius: 4px; cursor: pointer;
  }
  .sidecar-quad-toggle-btn.active { border-color: var(--accent); color: #fff; }
  .sidecar-panels { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .sidecar-panels-single { display: flex; }
  .sidecar-panels-single > .hm-panel { flex: 1; }
  /* Horizontal layout (this correction): panels sit side by side as full-
     height columns, matching the reference screenshots/HTML exactly —
     never stacked vertically. overflow-x:auto is a safety net so extra
     panes remain reachable rather than being silently clipped if the
     sidecar is resized narrower than N legible columns. */
  .sidecar-panels-horizontal { display: flex; flex-direction: row; overflow-x: auto; overflow-y: hidden; }
  .sidecar-horizontal-pane {
    flex: 1 1 0; min-width: 200px; border-right: 1px solid var(--border); display: flex; height: 100%;
  }
  .sidecar-horizontal-pane .hm-panel { width: 100%; }
  .sidecar-horizontal-pane:last-child { border-right: none; }

  .sidecar-quad-popover {
    position: fixed; z-index: 1100; background: #101014; border: 1px solid #2a2e39;
    border-radius: 6px; padding: 10px; font-family: var(--mono); font-size: 11px;
  }
  .sidecar-quad-popover-title { color: var(--text-dim); margin-bottom: 6px; }
  .sidecar-quad-count-btn {
    background: #1a1a24; border: 1px solid #2a2e39; color: var(--text-dim);
    font-family: var(--mono); font-size: 11px; padding: 4px 10px; border-radius: 4px;
    cursor: pointer; margin-right: 4px;
  }
  .sidecar-quad-count-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

  /* --- Heatmap panel (web/js/heatmap.js) ------------------------------- */
  .hm-panel { display: flex; flex-direction: column; height: 100%; min-height: 0; font-size: 11px; }

  .hm-header {
    display: flex; flex-direction: column; gap: 6px;
    padding: 8px 10px; border-bottom: 1px solid var(--border);
  }
  .hm-header-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .hm-ticker-select {
    background: #1a1a24; border: 1px solid #2a2e39; color: #fff;
    font-family: var(--mono); font-weight: 600; font-size: 12px;
    padding: 4px 6px; border-radius: 4px;
  }
  .hm-price { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .hm-change-badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; }
  .hm-change-badge.positive { color: var(--up-txt, #22c55e); background: rgba(34,197,94,0.15); }
  .hm-change-badge.negative { color: #f0616d; background: rgba(240,97,109,0.15); }
  .hm-close-btn {
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    font-size: 14px; line-height: 1; padding: 0 2px;
  }

  .hm-subheader {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 10px; font-size: 10px; color: var(--text-dim);
  }
  .hm-king-label { display: flex; align-items: center; gap: 4px; }
  .hm-king-dot { width: 6px; height: 6px; border-radius: 50%; background: #fbbf24; display: inline-block; }
  .hm-king-strike { color: #fbbf24; }
  .hm-settings-gear {
    background: #0d0d11; border: 1px solid var(--border); color: var(--text-dim);
    font-size: 11px; padding: 2px 6px; border-radius: 4px; cursor: pointer;
  }

  /* Settings popover (this correction): floats above the panel, appended
     to document.body so it's never clipped by a scrolling ancestor. */
  .hm-settings-popover {
    position: fixed; z-index: 1100; background: #101014; border: 1px solid #2a2e39;
    border-radius: 6px; padding: 10px; width: 220px; font-family: var(--mono); font-size: 11px;
  }
  .hm-settings-popover-title { color: #fff; margin-bottom: 8px; }
  .hm-settings-row-label { color: var(--text-dim); font-size: 9px; margin: 8px 0 3px; }
  .hm-settings-popover .hm-badges-toggle { margin: 4px 0; }
  .hm-exposure-toggle { display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .hm-exp-btn {
    background: #0d0d11; border: none; color: var(--text-dim); font-family: var(--mono);
    font-size: 9px; padding: 3px 6px; cursor: pointer; border-right: 1px solid var(--border);
  }
  .hm-exp-btn:last-child { border-right: none; }
  .hm-exp-btn.active { background: #2a2e39; color: #fff; }

  .hm-filters {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px; font-size: 10px; color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }
  .hm-badges-toggle {
    display: flex; align-items: center; gap: 4px; cursor: pointer; margin-left: auto;
  }
  .hm-badges-toggle input { accent-color: var(--accent); }

  .hm-expiration-row {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px; font-size: 10px; color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }
  .hm-expiration-toggle { display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .hm-expscope-btn {
    background: #0d0d11; border: none; color: var(--text-dim); font-family: var(--mono);
    font-size: 9px; padding: 3px 8px; cursor: pointer; border-right: 1px solid var(--border);
  }
  .hm-expscope-btn:last-child { border-right: none; }
  .hm-expscope-btn.active { background: #2a2e39; color: #fff; }
  .hm-expiration-n {
    background: #0d0d11; border: 1px solid var(--border); color: var(--text-dim);
    font-family: var(--mono); font-size: 10px; padding: 2px 4px; border-radius: 3px;
  }

  .hm-rows { flex: 1; overflow-y: auto; min-height: 0; }
  .hm-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 2px 10px; font-family: var(--mono); font-size: 11px;
    border-bottom: 1px solid rgba(0,0,0,0.15);
  }
  .hm-strike { width: 46px; }
  .hm-value { text-align: right; flex: 1; }
  .hm-badge { display: inline-block; margin-right: 5px; vertical-align: middle; }
  .hm-badge-king {
    width: 0; height: 0; border-radius: 0;
    border-left: 5px solid transparent; border-right: 5px solid transparent;
    border-bottom: 8px solid #fbbf24; /* gold triangle — reliable across fonts, unlike a ★ glyph */
    filter: drop-shadow(0 0 2px rgba(251,191,36,0.8));
  }
  .hm-badge-gate { width: 6px; height: 6px; border-radius: 50%; background: #e8e8ec; }
  .hm-badge-hedge { width: 8px; height: 6px; border: 1.5px solid #9aa; border-radius: 3px; background: none; }

  /* Session-change % badges — matches the reference layout: a small dark
     pill with a colored border/text, sitting just left of the value,
     distinct from the King/Gatekeeper/Hedge role markers above. */
  .hm-pct-badge {
    display: inline-block; margin-right: 5px; padding: 1px 5px;
    border-radius: 8px; font-size: 9px; font-weight: 700; font-family: var(--mono);
    line-height: 1.4;
  }
  .hm-pct-positive { background: #0d1f14; color: #4cd964; border: 1px solid #4cd964; }
  .hm-pct-negative { background: #2a1414; color: #ff5e5e; border: 1px solid #ff5e5e; }

  .hm-row-current {
    outline: 1px solid #fff;
  }
  .hm-current-marker {
    background: #fff; color: #000; font-weight: bold;
    padding: 1px 6px; border-radius: 2px; margin-right: 4px;
  }

  .hm-error { padding: 12px; color: #f0616d; font-size: 11px; }

  .hm-footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 10px; font-size: 9px; color: var(--text-dim);
    border-top: 1px solid var(--border); position: relative;
  }
  .hm-gradient-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; }

  /* --- Quadrinity view (web/js/quadrinity.js) --------------------------- */
  #quadrinity-view { display: none; flex-direction: column; flex: 1; min-height: 0; }
  #quadrinity-view.active { display: flex; }
  #atlas-view { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  #atlas-view.hidden { display: none; }

  .quad-toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 18px; border-bottom: 1px solid var(--border); font-size: 11px;
  }
  .quad-pane-count-group, .quad-exposure-group {
    display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden;
  }
  .quad-count-btn, .quad-exp-btn {
    background: #0d0d11; border: none; color: var(--text-dim); font-family: var(--mono);
    font-size: 10px; padding: 4px 8px; cursor: pointer; border-right: 1px solid var(--border);
  }
  .quad-count-btn:last-child, .quad-exp-btn:last-child { border-right: none; }
  .quad-count-btn.active, .quad-exp-btn.active { background: #2a2e39; color: #fff; }
  .quad-add-pane-btn {
    background: #0d0d11; border: 1px solid var(--border); color: var(--text-dim);
    font-family: var(--mono); font-size: 10px; padding: 4px 10px; border-radius: 4px; cursor: pointer;
  }
  .quad-badges-toggle {
    display: flex; align-items: center; gap: 4px; cursor: pointer;
    padding: 3px 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 10px;
  }
  .quad-badges-toggle input { accent-color: var(--accent); }
  .quad-confluence-banner {
    margin-left: auto; display: flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 11px;
  }
  .quad-confluence-state {
    padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); color: var(--text-dim);
  }
  .quad-confluence-state.quad-full-align { color: #fff; border-color: #fbbf24; background: rgba(251,191,36,0.12); }
  .quad-read { padding: 3px 8px; border-radius: 4px; font-weight: 600; }
  .quad-read-bullish { color: #22c55e; background: rgba(34,197,94,0.15); }
  .quad-read-bearish { color: #f0616d; background: rgba(240,97,109,0.15); }
  .quad-read-neutral { color: var(--text-dim); background: rgba(255,255,255,0.05); }
  .quad-outliers { color: var(--text-dim); font-size: 10px; }

  #quadrinity-grid {
    flex: 1; min-height: 0; display: grid; gap: 1px;
    background: var(--border); /* grid gap shows as thin dividers between panes */
  }
  .quad-pane { background: var(--panel); min-height: 0; display: flex; }
  .quad-pane .hm-panel { width: 100%; }

  footer {
    padding: 6px 18px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--text-dim);
    display: flex; justify-content: space-between;
  }

  /* --- Atlas Projections --------------------------------------- */
  .atlas-projection-group { display: inline-flex; align-items: center; gap: 8px; padding-left: 8px; border-left: 1px solid var(--border, #1e1e24); }
  .atlas-projection-window { width: 120px; accent-color: var(--accent); }
  .atlas-projection-window:disabled { opacity: 0.4; }
  .atlas-projection-window-label { font-size: 10px; color: var(--text-dim); min-width: 150px; }
  .atlas-projection-dte-row { display: inline-flex; gap: 3px; }
  .atlas-projection-dte-btn {
    background: var(--panel-bg, #14141a); border: 1px solid var(--border, #1e1e24); color: var(--text-dim);
    font-size: 10px; padding: 3px 7px; border-radius: 3px; cursor: pointer;
  }
  .atlas-projection-dte-btn.active { background: rgba(240,190,90,0.18); border-color: #f0be5a; color: #f0be5a; }
  .atlas-projection-canvas { position: absolute; left: 0; top: 0; z-index: 3; }

  /* --- Atlas left rail: every charting-feature control, stacked ----------- */
  #atlas-rail {
    flex: 0 0 214px; width: 214px; box-sizing: border-box;
    border-right: 1px solid var(--border); background: #0a0a0d;
    padding: 14px 12px; display: flex; flex-direction: column; gap: 16px;
    overflow-y: auto; font-size: 11px; color: var(--text-dim);
  }
  .rail-section { display: flex; flex-direction: column; gap: 7px; }
  .rail-header {
    display: flex; align-items: center; gap: 6px;
    font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: #7d7d89;
  }
  .rail-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  #atlas-rail .atlas-interval-group { display: flex; width: 100%; }
  #atlas-rail .atlas-interval-btn { flex: 1; padding: 6px 0; text-align: center; }
  .rail-btn {
    background: #1a1a24; border: 1px solid #2a2e39; color: var(--text-dim);
    font-family: var(--mono); font-size: 10px; padding: 5px 9px; border-radius: 4px; cursor: pointer;
  }
  .rail-btn:hover { color: #fff; border-color: #3a3f4d; }
  .rail-btn-wide { width: 100%; text-align: left; }
  .rail-switch { display: flex; align-items: center; gap: 7px; cursor: pointer; color: #cfd3da; user-select: none; }
  .rail-switch { position: relative; }
  .rail-switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 1; }
  .rail-switch-track {
    width: 26px; height: 14px; border-radius: 8px; background: #2a2e39; position: relative;
    transition: background 120ms; flex: none;
  }
  .rail-switch-track::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%;
    background: #8a8a94; transition: transform 120ms, background 120ms;
  }
  .rail-switch input:checked + .rail-switch-track { background: rgba(240,190,90,0.35); }
  .rail-switch input:checked + .rail-switch-track::after { transform: translateX(12px); background: var(--accent); }
  .rail-status { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; font-size: 10px; line-height: 1.4; }
  .rail-status-text { color: #d8dce6; }
  .rail-status-off { color: #6b6b76; }
  .rail-live-dot {
    width: 6px; height: 6px; border-radius: 50%; background: #4caf7d; box-shadow: 0 0 6px #4caf7d;
    animation: rail-pulse 1.8s ease-in-out infinite; flex: none;
  }
  .rail-live-tag { color: #4caf7d; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; }
  @keyframes rail-pulse { 50% { opacity: 0.35; } }

  /* --- Atlas settings windows (Orbs / Expiry Data / Projections) ---------- */
  .atlas-window .atlas-window-label {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #7d7d89; margin: 16px 0 8px;
  }
  .atlas-chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .atlas-chip {
    display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 62px;
    background: #14141a; border: 1px solid #2a2e39; color: var(--text-dim);
    font-family: var(--mono); font-size: 12px; padding: 8px 12px; border-radius: 6px; cursor: pointer;
    transition: border-color 120ms, background 120ms;
  }
  .atlas-chip:hover { border-color: #3a3f4d; color: #fff; }
  .atlas-chip.active { border-color: var(--accent); background: rgba(240,190,90,0.12); color: #fff; }
  .atlas-chip-sub { font-size: 9px; color: #7d7d89; }
  .atlas-chip.active .atlas-chip-sub { color: #d9b46a; }
  .atlas-chip-row-greeks .atlas-chip { min-width: 100px; }
  .atlas-combo-row { margin-top: 8px; }
  .atlas-combo-chip { min-width: 150px; }
  .atlas-window-preview {
    margin-top: 18px; padding: 10px 12px; border: 1px solid #23262f; border-radius: 6px; background: #0d0d11;
    display: flex; flex-wrap: wrap; align-items: center; gap: 7px; font-size: 12px;
  }
  .atlas-window-note, .atlas-window-hint { margin-top: 10px; font-size: 10px; color: #6b6b76; line-height: 1.5; }
  .atlas-orb-nodes { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .atlas-orb-nodes-input {
    width: 84px; background: #1a1a24; border: 1px solid #2a2e39; color: #fff;
    font-family: var(--mono); font-size: 13px; padding: 7px 9px; border-radius: 5px;
  }
  .atlas-orb-nodes-presets .atlas-chip { min-width: 40px; padding: 6px 9px; font-size: 11px; }
  .atlas-orb-colors { display: flex; gap: 22px; flex-wrap: wrap; }
  .atlas-color-field { display: flex; align-items: center; gap: 9px; color: var(--text-dim); font-size: 12px; cursor: pointer; }
  .atlas-color-field input[type="color"] {
    width: 34px; height: 26px; padding: 0; border: 1px solid #2a2e39; border-radius: 4px; background: #14141a; cursor: pointer;
  }
  .atlas-orb-slider-row { display: block; color: var(--text-dim); font-size: 11px; margin-bottom: 10px; }
  .atlas-orb-slider-row .atlas-orb-val { float: right; color: #cfd3da; }
  .atlas-orb-slider-row input[type="range"] { width: 100%; accent-color: var(--accent); display: block; margin-top: 4px; }
  .atlas-window-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

  /* --- Heatmap header: vertically stacked ticker / DTE / Velocity / EXTREME --- */
  .hm-ctrl-stack { display: flex; flex-direction: column; gap: 4px; }
  .hm-ctrl-btn {
    display: flex; align-items: center; justify-content: space-between; width: 100%; box-sizing: border-box;
    background: #14141a; border: 1px solid #2a2e39; color: var(--text-dim);
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.04em; padding: 5px 8px; border-radius: 4px; cursor: pointer;
  }
  .hm-ctrl-btn:hover { color: #fff; border-color: #3a3f4d; }
  .hm-ctrl-btn.active { color: #fff; border-color: var(--accent); background: rgba(240,190,90,0.12); }
  .hm-velocity-btn.active { border-color: #3ddc84; background: rgba(61,220,132,0.10); }
  .hm-caret { opacity: 0.6; }
  .hm-neg-label { display: flex; align-items: center; gap: 4px; margin-left: 8px; }
  .hm-neg-dot { width: 6px; height: 6px; border-radius: 50%; background: #a855f7; display: inline-block; }
  .hm-subheader { gap: 0; }
  .hm-subheader .hm-settings-gear { margin-left: auto; }
  .hm-badge-neg {
    width: 0; height: 0; border-radius: 0;
    border-left: 5px solid transparent; border-right: 5px solid transparent;
    border-top: 8px solid #a855f7; /* purple down-triangle: the most negative strike */
    filter: drop-shadow(0 0 2px rgba(168,85,247,0.8));
  }
  .hm-vel-pill {
    display: inline-block; margin-right: 5px; padding: 0 6px; border-radius: 9px; font-size: 9px; font-weight: 700;
    font-family: var(--mono); line-height: 1.5; background: rgba(8,10,14,0.55); border: 1px solid currentColor;
  }
  .hm-vel-pos { color: #3ddc84; }   /* accumulation: green outline */
  .hm-vel-neg { color: #ff5c6c; }   /* unwinding: red outline */
  .hm-vel-new { color: #7fb0ff; }   /* node did not exist at the reference */
  .hm-dte-menu {
    position: fixed; z-index: 1000; width: 250px; box-sizing: border-box; padding: 10px 12px;
    background: #101015; border: 1px solid #2a2e39; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  .hm-menu-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .hm-menu-chip {
    background: #14141a; border: 1px solid #2a2e39; color: var(--text-dim); font-family: var(--mono);
    font-size: 10px; padding: 5px 8px; border-radius: 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px;
  }
  .hm-menu-chip small { font-size: 8px; color: #6b6b76; }
  .hm-menu-chip:hover { color: #fff; }
  .hm-menu-chip.active { color: #fff; border-color: var(--accent); background: rgba(240,190,90,0.12); }
  .hm-vel-custom { display: none; flex-wrap: wrap; gap: 8px; margin: 4px 0 8px; font-size: 10px; color: var(--text-dim); }
  .hm-vel-custom label { display: flex; align-items: center; gap: 3px; cursor: pointer; }
  .hm-settings-popover select { width: 100%; margin: 2px 0 6px; background: #0d0d11; border: 1px solid var(--border); color: var(--text-dim); font-family: var(--mono); font-size: 10px; padding: 3px 4px; border-radius: 3px; }
  .sidecar-header-spacer { flex: 1; }
  .sidecar-badges-btn {
    background: #1a1a24; border: 1px solid #2a2e39; color: var(--text-dim);
    font-family: var(--mono); font-size: 10px; padding: 4px 10px; border-radius: 4px; cursor: pointer;
  }
  .sidecar-badges-btn.active { border-color: var(--accent); color: #fff; }

  .sidecar-header-controls { flex-wrap: nowrap; gap: 6px; }
  .sidecar-header-controls .sidecar-quad-toggle { white-space: nowrap; font-size: 10px; }
  .sidecar-badges-btn, .sidecar-quad-toggle-btn { white-space: nowrap; font-size: 9px; padding: 4px 5px; letter-spacing: 0; }
  .sidecar-header-controls { padding-left: 8px; padding-right: 8px; gap: 4px; }
  .sidecar-header-controls .sidecar-quad-toggle { font-size: 9px; gap: 3px; }

  /* --- Header: live dot, title, page tabs ---------------------------------- */
  .live-dot {
    width: 10px; height: 10px; border-radius: 50%; flex: none; background: #e0a526;
    box-shadow: 0 0 6px rgba(224,165,38,0.55); transition: background 250ms, box-shadow 250ms;
  }
  .live-dot.live { background: #3ddc84; box-shadow: 0 0 9px rgba(61,220,132,0.85); animation: live-pulse 2.2s ease-in-out infinite; }
  @keyframes live-pulse { 50% { box-shadow: 0 0 3px rgba(61,220,132,0.4); } }
  .header-tabs { display: flex; gap: 8px; margin-left: 28px; margin-right: auto; }

  /* --- Atlas heatmaps: controls consolidated into the settings popover ------ */
  .hm-selection-line { display: none; font-size: 9px; letter-spacing: 0.06em; color: #7d7d89; }
  .hm-compact .hm-ctrl-stack { display: none; }
  .hm-compact .hm-selection-line { display: block; }
  .hm-compact-controls { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .hm-compact-controls .hm-settings-row-label { margin-top: 4px; }
  .hm-compact-controls .hm-menu-chips { margin-bottom: 4px; }
  .hm-settings-popover { max-height: 86vh; overflow-y: auto; }
  .hm-popover-compact { width: 260px; }
  .hm-popover-compact .hm-extremes-label { display: none; }
</style>
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <span id="live-dot" class="live-dot" title="Connecting\u2026"></span>
        <span>Charting System</span>
      </div>
      <nav class="header-tabs" aria-label="Pages">
        <span class="pill active" id="tab-atlas">ATLAS</span>
        <span class="pill" id="tab-quadrinity">QUADRINITY</span>
      </nav>
      <div class="status">
        <span id="backend-dot" class="dot"></span>
        <span id="backend-label">connecting to backend&hellip;</span>
      </div>
    </header>

    <div id="atlas-view">
      <div class="toolbar">
        <div id="atlas-layout-controls" style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;"></div>
      </div>
      <main>
        <aside id="atlas-rail" aria-label="Charting controls"></aside>
        <div id="chart-pane"><div id="atlas-multi-grid" class="atlas-multi-grid atlas-grid-single"></div></div>
        <div id="atlas-resizer" title="Drag to resize"></div>
        <div id="sidecar"></div>
      </main>
    </div>

    <div id="quadrinity-view">
      <div class="quad-toolbar" id="quadrinity-toolbar"></div>
      <div id="quadrinity-grid"></div>
    </div>

    <footer>
      <span>build: quadrinity-view</span>
      <span id="clock"></span>
    </footer>
  </div>

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="/js/colorscale.js"></script>
<script src="/js/nodeutils.js"></script>
<script src="/js/heatmap.js"></script>
<script src="/js/chart-coords.js"></script>
<script src="/js/atlas.js"></script>
<script src="/js/atlas-orbs.js"></script>
<script src="/js/atlas-projections.js"></script>
<script src="/js/atlas-drawing.js"></script>
<script src="/js/atlas-layout.js"></script>
<script src="/js/atlas-sidecar.js"></script>
<script src="/js/quadrinity.js"></script>
<script>
  // --- Live indicator ------------------------------------------------------
  // The dot beside "Charting System" is amber until the terminal is actually
  // pulling data, then turns green: it reflects the last SUCCESSFUL data
  // request (candles / heatmaps / projections — not the health ping), and
  // goes back to amber if nothing has arrived for a few seconds.
  (function () {
    const origFetch = window.fetch.bind(window);
    let lastDataOk = 0;
    window.fetch = async function (...args) {
      const res = await origFetch(...args);
      try {
        const url = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url) || '';
        if (res.ok && url.includes('/api/') && !url.includes('/api/health')) lastDataOk = Date.now();
      } catch (e) { /* never let instrumentation break a request */ }
      return res;
    };
    const dot = document.getElementById('live-dot');
    function paint() {
      const live = Date.now() - lastDataOk < 6000;
      dot.classList.toggle('live', live);
      dot.title = live ? 'Terminal active \u2014 pulling and displaying live data' : 'Waiting for data\u2026';
    }
    paint();
    setInterval(paint, 500);
  })();

  // --- Backend liveness check -------------------------------------------
  // Proves the C++23 backend (src/main.cpp) and this static frontend are
  // wired together through the same forwarded port, per ARCHITECTURE.md.
  async function pingBackend() {
    const dot = document.getElementById('backend-dot');
    const label = document.getElementById('backend-label');
    try {
      const res = await fetch('/api/health');
      const data = await res.json();
      dot.classList.remove('err'); dot.classList.add('ok');
      label.textContent = `backend: ${data.status} (${data.stage})`;
    } catch (e) {
      dot.classList.remove('ok'); dot.classList.add('err');
      label.textContent = 'backend unreachable';
    }
  }
  pingBackend();
  setInterval(pingBackend, 5000);

  (async function init() {
    let tickerOptions = ['SPY'];
    try {
      const res = await fetch('/api/tickers');
      const data = await res.json();
      if (Array.isArray(data.tickers) && data.tickers.length) tickerOptions = data.tickers;
    } catch (e) { /* fall back to default single-ticker option */ }

    const defaultTicker = tickerOptions.includes('SPY') ? 'SPY' : tickerOptions[0];

    // Atlas main chart area (Part C + this feature's multi-window layout
    // manager) — candles + Orbs/Dark Pool/Flow overlays, 1-4 synchronized
    // panes.
    createAtlasLayoutManager(document.getElementById('atlas-multi-grid'), document.getElementById('atlas-layout-controls'), {
      defaultTicker,
      tickerOptions,
      railEl: document.getElementById('atlas-rail'),
    });

    // Atlas sidecar (this feature): single Heatmap panel by default, or a
    // "Quadrinity" 2-4 pane HORIZONTAL row when toggled on. Auto-sizes the
    // sidecar's default width to the pane count (so 4 panels aren't
    // crammed into a 300px column the moment they appear) — the resizer
    // below still lets the user override that at any time.
    const sidecarEl = document.getElementById('sidecar');
    const PANE_WIDTH_PX = 260;
    const sidecarApi = createAtlasSidecar(sidecarEl, {
      defaultTicker,
      tickerOptions,
      onPaneCountChange(count) {
        sidecarEl.style.width = `${Math.min(count * PANE_WIDTH_PX, window.innerWidth * 0.7)}px`;
      },
      onVisibilityChange(show) {
        // The sidecar itself is display:none while hidden (atlas-sidecar.js), so only the pieces
        // that live OUTSIDE it need handling: the divider, and the toolbar restore button that
        // replaces the (now hidden) "Show Heatmap" checkbox. Width is left untouched, so turning
        // it back on restores exactly the previous split.
        document.getElementById('atlas-resizer').style.display = show ? '' : 'none';
        restoreBtn.style.display = show ? 'none' : '';
      },
    });
    const restoreBtn = document.createElement('button');
    restoreBtn.className = 'atlas-heatmap-restore-btn';
    restoreBtn.textContent = '\u25A4 Show heatmap';
    restoreBtn.title = 'Show the heatmap panel again';
    restoreBtn.style.display = 'none';
    restoreBtn.addEventListener('click', () => sidecarApi.setVisible(true));
    document.getElementById('atlas-layout-controls').appendChild(restoreBtn);

    // Resizable divider (this feature): drag to reallocate horizontal
    // space between the chart area and the sidecar heatmap(s). Verified
    // to work identically regardless of how many chart panes (Atlas
    // layout) or heatmap panes (sidecar Quadrinity mode) are currently
    // showing, since it only ever adjusts #sidecar's own width — the
    // chart grid and sidecar panel count are otherwise fully independent.
    (function initResizer() {
      const resizer = document.getElementById('atlas-resizer');
      const MIN_SIDECAR_WIDTH = 200;
      let dragging = false;
      let startX = 0;
      let startWidth = 0;

      resizer.addEventListener('mousedown', (e) => {
        dragging = true;
        startX = e.clientX;
        startWidth = sidecarEl.getBoundingClientRect().width;
        resizer.classList.add('resizing');
        document.body.style.userSelect = 'none';
        e.preventDefault();
      });
      window.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        // Sidecar sits on the right; dragging the divider LEFT (negative
        // delta) should grow it, dragging RIGHT should shrink it.
        const delta = startX - e.clientX;
        const maxWidth = window.innerWidth * 0.85;
        const newWidth = Math.max(MIN_SIDECAR_WIDTH, Math.min(maxWidth, startWidth + delta));
        sidecarEl.style.width = `${newWidth}px`;
      });
      window.addEventListener('mouseup', () => {
        if (!dragging) return;
        dragging = false;
        resizer.classList.remove('resizing');
        document.body.style.userSelect = '';
      });
    })();

    // Quadrinity (Part D, renamed — see ARCHITECTURE.md §0) — lazily
    // created on first tab activation so its background polling doesn't
    // run at all if the user never opens the tab.
    let quadrinity = null;
    const atlasView = document.getElementById('atlas-view');
    const quadrinityView = document.getElementById('quadrinity-view');
    const tabAtlas = document.getElementById('tab-atlas');
    const tabQuadrinity = document.getElementById('tab-quadrinity');

    function showAtlas() {
      atlasView.classList.remove('hidden');
      quadrinityView.classList.remove('active');
      tabAtlas.classList.add('active');
      tabQuadrinity.classList.remove('active');
    }
    function showQuadrinity() {
      atlasView.classList.add('hidden');
      quadrinityView.classList.add('active');
      tabAtlas.classList.remove('active');
      tabQuadrinity.classList.add('active');
      if (!quadrinity) {
        quadrinity = createQuadrinityView(
          document.getElementById('quadrinity-grid'),
          document.getElementById('quadrinity-toolbar'),
          { tickerOptions, initialTickers: tickerOptions.slice(0, 3) }
        );
      }
    }
    tabAtlas.addEventListener('click', showAtlas);
    tabQuadrinity.addEventListener('click', showQuadrinity);
  })();

  setInterval(() => {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString();
  }, 1000);
</script>
</body>
</html>
